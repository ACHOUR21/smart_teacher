name: Build Android APK

on:
  push:
    branches: [claude/platform-build-AZSQq, main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL to embed in the APK'
        required: false
        default: 'https://api.eduai.com/api/v1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Write API URL to env
        run: |
          API_URL="${{ github.event.inputs.api_url || 'https://api.eduai.com/api/v1' }}"
          echo "NEXT_PUBLIC_API_URL=${API_URL}" >> .env.production
          echo "NEXT_PUBLIC_WS_URL=${API_URL%/api/v1}" >> .env.production
        working-directory: apps/web

      - name: Build Next.js static export
        run: BUILD_TARGET=static npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/web/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eduai-debug-${{ github.sha }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build release APK (if keystore secret set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon
        working-directory: apps/web/android

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eduai-release-${{ github.sha }}
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
